name: CI

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
  # 손으로 돌릴 수 있게 열어 둔다. 머지했는데 실행이 안 잡히는 일이 실제로 있었고
  # (2026-08-07 Actions 장애 — push 이벤트가 통째로 유실됐다) 그때 다시 굴릴 방법이
  # 없었다. 배포만 다시 태우고 싶을 때도 쓴다.
  workflow_dispatch:

# 워크플로 기본은 읽기만(보안 점검 SUP-3). 저장소에 쓰는 단계가 없다 — 배포는 Jenkins 가
# 가져가서 한다. 쓰기 토큰을 주면 버전이 고정된 외부 액션이라도 그 토큰을 받는다.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # 테스트 결과를 체크(checks)와 PR 주석(pull-requests)으로 남기는 두 액션만 쓰기가 필요하다.
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout Branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # groo-core 를 GitHub Packages 에서 받으려면 토큰이 필요하다.
      # 이 레포의 시크릿 이름만 READ_PACKAGES_TOKEN(복수)이다 — desk/sso 는 단수.
      - name: Test with Gradle
        run: ./gradlew --info test
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.READ_PACKAGES_TOKEN }}

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@da5b7be67623cd59bbbd1a0ce4f022050a55605f # v2.26.0
        if: always()
        with:
          files: 'build/test-results/**/*.xml'

      - name: If the test fails, register a check comment in the failed code line
        uses: mikepenz/action-junit-report@db71d41eb79864e25ab0337e395c352e84523afe # v4.3.1
        if: always()
        with:
          report_paths: 'build/test-results/**/*.xml'
          token: ${{ github.token }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/reports/jacoco/test/jacocoTestReport.xml

  trigger-deploy:
    needs: test
    # PR 만 빼면 된다. `== 'push'` 로 못 박으면 수동 실행이 테스트만 하고 끝나
    # 정작 필요한 배포를 건너뛴다.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins Deploy
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          # 토큰은 Jenkins 잡 설정에만 있는 값이다. 레포에 적어 두면 그걸 아는 사람 누구나
          # 인증 없이 배포를 걸 수 있다 — Jenkins 는 인터넷에서 열려 있다.
          DEPLOY_TOKEN: ${{ secrets.JENKINS_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          # 시크릿에 줄바꿈이나 공백이 딸려 오면 curl 이 URL 을 못 읽는다(exit 3).
          # 값이 마스킹돼 로그로는 안 보이니 여기서 털어 낸다.
          BASE="$(printf '%s' "${JENKINS_URL}" | tr -d '[:space:]')"
          BASE="${BASE%/}"
          case "${BASE}" in
            http://*|https://*) ;;
            "") echo "::error::JENKINS_URL 이 비어 있습니다."; exit 1 ;;
            *) echo "::error::JENKINS_URL 은 http:// 또는 https:// 로 시작해야 합니다."; exit 1 ;;
          esac
          # 토큰도 같은 사고를 당한다 — 붙여넣다 딸려 온 줄바꿈이 쿼리스트링에 그대로 들어간다.
          TOKEN="$(printf '%s' "${DEPLOY_TOKEN}" | tr -d '[:space:]')"
          # 빈 토큰으로 부르면 Jenkins 가 404 를 주고 curl -f 가 잡지만, 로그만 보면
          # 원인이 URL 오타인지 토큰 미설정인지 알 수 없다. 여기서 이름을 대고 죽는다.
          if [ -z "${TOKEN}" ]; then
            echo "::error::JENKINS_DEPLOY_TOKEN 시크릿이 비어 있습니다."
            exit 1
          fi
          # -f 가 없으면 404·500 에도 curl 이 0 을 돌려준다. 토큰을 틀리게 적어도
          # 초록불이 뜨고 배포는 안 되는 상태가 되므로, HTTP 오류를 실패로 받는다.
          curl -fsS -X POST "${BASE}/generic-webhook-trigger/invoke?token=${TOKEN}"
