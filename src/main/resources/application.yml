spring:
  config:
    import: optional:file:.env.${SPRING_PROFILES_ACTIVE:local}[.properties]
  application:
    name: porest
  main:
    allow-bean-definition-overriding: true
  messages:
    basename: message/core-messages,message/messages,message/messages-skc
    encoding: utf-8

  # DB 설정
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:1800000}
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION:60000}

  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_batch_fetch_size: 100

  # Redis 설정
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE}

  # 파일 업로드 제한
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:50MB}

  # Graceful Shutdown
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

  # 메일 설정
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connection-timeout: 5000
          timeout: 5000
          write-timeout: 5000

# 서버 설정
server:
  port: ${SERVER_PORT:8001}
  shutdown: ${SERVER_SHUTDOWN:graceful}
  # native = Tomcat RemoteIpValve. 사설 대역(nginx 컨테이너)에서 온 요청일 때만 X-Forwarded-For 를 오른쪽부터 읽어
  # 실제 사용자 IP 를 getRemoteAddr() 에 넣는다(sso 와 같다). framework(Spring ForwardedHeaderFilter)는 X-Forwarded-For
  # 의 맨 왼쪽 값을 그대로 써서, 요청자가 헤더 하나로 IP 를 바꿀 수 있었다 — IP 차단·레이트리밋·감사 IP 가 모두 위조
  # 가능했다(2026-11-11 보안 점검). core ClientIpResolver 는 이 값을 믿으므로 framework 로 되돌리지 말 것.
  forward-headers-strategy: native
  # 에러 응답 노출 제어 (server.error.*). 각 값 의미는 .env.example 참고
  error:
    include-stacktrace: ${ERROR_STACKTRACE:never}
    include-message: ${ERROR_MESSAGE:never}
    include-exception: ${ERROR_EXCEPTION:false}
    include-binding-errors: ${ERROR_BINDING:never}
  servlet:
    session:
      timeout: 8h
      cookie:
        secure: ${COOKIE_SECURE:true}
        same-site: ${COOKIE_SAME_SITE:lax}
        http-only: true

# 로깅 설정
logging:
  level:
    io.groo.ieum: ${LOG_LEVEL:info}
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE:info}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOG_LEVEL_HIBERNATE_BINDER:info}
    p6spy: ${LOG_LEVEL_P6SPY:info}
    root: ${LOG_LEVEL_ROOT:info}

# p6spy SQL 로깅 — 기본은 꺼짐이다.
#
# p6spy 는 `?` 자리에 바인딩 값을 끼워 넣은 **완성 SQL** 을 한 줄 더 남긴다. 여기는 인사
# 시스템이라 그 줄에 user 의 user_name·user_email·user_birth(생년월일)·join_date·
# user_origin_company 가, 그리고 휴가·근태·회비 테이블의 개인별 기록이 INSERT/UPDATE 문에
# 통째로 찍힌다. 한 줄 안에 이름과 생년월일과 이메일이 같이 있으면 그건 그냥 신원이다.
#
# **RequestResponseLoggingFilter 의 마스킹은 여기에 닿지 않는다.** core 마스커가 보는 건
# JSON 의 `"키":값` 과 쿼리스트링의 `키=값` 인데, SQL 의 INSERT 는 값이 자리로만 온다
# (`insert into t (a,b) values ('...','...')`) — 값 옆에 컬럼명이 없어 무엇을 가릴지 알 수 없다.
# 그래서 이건 마스킹으로 못 막고 끄는 것으로 막는다.
#
# 쿼리 **모양**만 보면 될 때는 이걸 켜지 말고 LOG_LEVEL_HIBERNATE=debug 를 써라 — `?` 가
# 그대로 남는다. 값까지 봐야 하는 디버깅은 로컬에서만 P6SPY_LOG_SQL_VALUES=true 로 켠다.
#
# 이름이 P6SPY_ENABLED 에서 바뀐 이유 — 예전 설정은 `spring.datasource.p6spy` 아래에 있었고
# 그 prefix 를 읽는 @ConfigurationProperties 가 없다(라이브러리는 `decorator.datasource` 를
# 읽는다). 그래서 P6SPY_ENABLED 는 어떤 값이어도 효과가 없었고 p6spy 는 라이브러리 기본값
# true 로 돌고 있었다. 자리만 고치고 이름을 그대로 뒀다면, 서버 .env 에 남아 있는
# P6SPY_ENABLED=true 가 이 커밋부터 **진짜로** 켜진다 — 그래서 이름을 갈았다.
decorator:
  datasource:
    p6spy:
      enable-logging: ${P6SPY_LOG_SQL_VALUES:false}
      multiline: true
      logging: slf4j

# 파일 업로드 경로
file:
  root-path: ${FILE_ROOT_PATH}
  web-url-prefix: /media
  resource-handler: ${file.web-url-prefix}/**
  resource-locations: file:${file.root-path}/
  temp:
    path:
      profile: ${file.root-path}/temp/profile
  origin:
    path:
      profile: ${file.root-path}/origin/profile

# 어플리케이션 정보
app:
  frontend:
    base-url: ${FRONTEND_BASE_URL}
  company:
    name: ${COMPANY_NAME:그루}
  email:
    logo:
      path: ${EMAIL_LOGO_PATH:templates/email/logo.png}

# Swagger 설정
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:false}
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: none
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  enable-querydsl: false

# JWT 설정
jwt:
  hr-secret: ${JWT_HR_SECRET}
  hr-access-expiration: ${JWT_HR_ACCESS_EXPIRATION:3600000}
  # SSO 토큰(RS256) 검증용 JWKS — SSO base URL + /.well-known/jwks.json (시작 시 fetch 안 함, 첫 검증 시 fetch·캐시)
  sso-jwks-uri: ${SSO_JWKS_URI:${SSO_API_URL:http://localhost:8000}/.well-known/jwks.json}

# 보안 설정
security:
  ip-blacklist:
    enabled: true
    log-level: WARN
    file-path: ${IP_BLACKLIST_FILE_PATH:config/ip-blacklist.txt}

# SSO 연동 설정
sso:
  api-url: ${SSO_API_URL}
  events:
    # SSO Redis 이벤트 서명 강제(보안 점검 IEU-6). 전환 기간엔 false — 서명 없는 이벤트도 경고와 함께 받는다.
    # sso-back 이 서명해서 발행하기 시작한 뒤 true 로 바꾼다
    require-signature: ${SSO_EVENTS_REQUIRE_SIGNATURE:false}
  client-code: ${SSO_CLIENT_CODE:hr}
  client-secret: ${SSO_CLIENT_SECRET:}
  timeout:
    connect: ${SSO_CONNECT_TIMEOUT:5000}
    read: ${SSO_READ_TIMEOUT:10000}

# Prometheus 설정
management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info
  # info 엔드포인트에서 info.* 프로퍼티(APP_VERSION 등)를 노출하려면 필요
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: porest-hr
    # API별 지연 분포(히스토그램) — Grafana 의 p95·p99 패널이 이 버킷으로 계산한다.
    # 꺼져 있으면 _count/_sum/_max 만 나가서 "평균"과 "최댓값"밖에 못 본다. 평균은 빠른
    # 요청에 끌려 내려가 느린 꼬리를 숨긴다. 버킷 범위를 5ms~10s 로 묶어 시계열 수를 줄인다
    # (기본값은 1ms~30s 라 쓸모없는 버킷까지 uri×status 마다 늘어난다).
    distribution:
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 5ms
      maximum-expected-value:
        http.server.requests: 10s

# 배포 버전 (Jenkins 가 git describe 결과를 APP_VERSION 으로 주입)
# 확인: GET /actuator/info
info:
  app:
    version: ${APP_VERSION:unknown}
